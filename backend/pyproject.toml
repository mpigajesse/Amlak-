[project]
name = "amlak-backend"
version = "0.1.0"
description = "Amlak — pilotage financier promotion immobilière (backend Django/DRF)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt[crypto]>=5.3,<5.4",
    "psycopg[binary]>=3.2,<3.3",
    "dj-database-url>=2.3,<3",
    "django-cors-headers>=4.6,<5",
    "django-filter>=24.3,<25",
    "celery[redis]>=5.4,<5.5",
    "redis>=5.2,<6",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6.0,<7",
    "factory-boy>=3.3,<4",
    "freezegun>=1.5,<2",
    "ruff>=0.8,<1",
    "black>=24.10,<25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "amlak.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=accounts --cov=core --cov-report=term-missing --cov-fail-under=70"
testpaths = ["accounts/tests", "core/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.black]
target-version = ["py312"]
line-length = 100
extend-exclude = '''
/(
    migrations
  | \.venv
)/
'''
