name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amlak
          POSTGRES_PASSWORD: amlak
          POSTGRES_DB: amlak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amlak" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://amlak:amlak@localhost:5432/amlak
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
      DJANGO_DEBUG: 'True'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      JWT_ACCESS_TOKEN_LIFETIME_MIN: '30'
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: '7'
      CORS_ALLOWED_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173'
      FRONTEND_URL: 'http://localhost:5173'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install backend dependencies
        run: cd backend && uv sync
        if: hashFiles('backend/pyproject.toml') != ''
      - name: Run migrations
        run: cd backend && uv run python manage.py migrate --noinput
        if: hashFiles('backend/pyproject.toml') != ''
        continue-on-error: true
      - name: Run pytest
        run: cd backend && uv run pytest
        if: hashFiles('backend/pyproject.toml') != ''
        continue-on-error: true
      - name: Run ruff check
        run: cd backend && uv run ruff check .
        if: hashFiles('backend/pyproject.toml') != ''
        continue-on-error: true
      - name: Run black check
        run: cd backend && uv run black --check .
        if: hashFiles('backend/pyproject.toml') != ''
        continue-on-error: true
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: hashFiles('backend/.coverage') != ''
        with:
          name: backend-coverage
          path: backend/.coverage
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
        if: hashFiles('frontend/package.json') != ''
        continue-on-error: true
      - name: Type check
        run: cd frontend && pnpm typecheck
        if: hashFiles('frontend/package.json') != ''
        continue-on-error: true
      - name: Run tests
        run: cd frontend && pnpm test -- --run
        if: hashFiles('frontend/package.json') != ''
        continue-on-error: true
      - name: Run ESLint
        run: cd frontend && pnpm lint
        if: hashFiles('frontend/package.json') != ''
        continue-on-error: true
      - name: Build
        run: cd frontend && pnpm build
        if: hashFiles('frontend/package.json') != ''
        continue-on-error: true
      - name: Install Playwright browsers
        run: cd frontend && pnpm exec playwright install --with-deps chromium
        if: hashFiles('frontend/package.json') != ''
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: |
      hashFiles('backend/pyproject.toml') != '' &&
      hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v3
      - name: Start services
        run: |
          docker-compose up -d
        continue-on-error: true
      - name: Wait for services
        run: |
          sleep 10
          for i in {1..30}; do
            curl http://localhost:5173 && curl http://localhost:8000/api/v1/auth/me/ && break
            echo "Waiting for services... attempt $i"
            sleep 2
          done
        continue-on-error: true
      - name: Run Playwright E2E
        run: cd frontend && pnpm exec playwright test --project=chromium
        if: hashFiles('frontend/playwright.config.ts') != ''
        continue-on-error: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
        continue-on-error: true
